# Google Cloud Build configuration for APS Performance Assistant
#
# Prerequisites:
#   1. Enable Cloud Build, Cloud Run, and Container Registry APIs
#   2. Set up required secrets in Secret Manager:
#      - OPENAI_API_KEY
#      - DB_PASSWORD (for Neon Postgres)
#
# Deploy manually:
#   gcloud builds submit --config=cloudbuild.yaml
#
# Set up trigger for auto-deploy on push:
#   gcloud builds triggers create github \
#     --repo-name=APS-Performance-Assistant \
#     --branch-pattern=^main$ \
#     --build-config=cloudbuild.yaml

substitutions:
  _REGION: australia-southeast1
  _BACKEND_SERVICE: aps-backend
  _FRONTEND_SERVICE: aps-frontend

steps:
  # ===========================================
  # Step 1: Build Backend Image
  # ===========================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'
    id: 'build-backend'

  # ===========================================
  # Step 2: Build Frontend Image
  # ===========================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'
    id: 'build-frontend'

  # ===========================================
  # Step 3: Push Backend Image
  # ===========================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${SHORT_SHA}'
    id: 'push-backend'
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest'
    waitFor: ['push-backend']

  # ===========================================
  # Step 4: Push Frontend Image
  # ===========================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${SHORT_SHA}'
    id: 'push-frontend'
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest'
    waitFor: ['push-frontend']

  # ===========================================
  # Step 5: Deploy Backend to Cloud Run
  # ===========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_BACKEND_SERVICE}'
      - '--image=gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest'
      - '--set-env-vars=LLM_MODEL=gpt-4o,LLM_PROVIDER=openai,EMBEDDING_MODEL=text-embedding-3-large'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # ===========================================
  # Step 6: Get Backend URL and Deploy Frontend
  # ===========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Get the backend URL
        BACKEND_URL=$(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        echo "Backend URL: $BACKEND_URL"

        # Deploy frontend with backend URL
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image=gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --set-env-vars="NEXT_PUBLIC_BACKEND_URL=$BACKEND_URL,NEXT_PUBLIC_API_URL=$BACKEND_URL"
    id: 'deploy-frontend'
    waitFor: ['deploy-backend', 'push-frontend']

  # ===========================================
  # Step 7: Output URLs
  # ===========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "=========================================="
        echo "Deployment Complete!"
        echo "=========================================="
        BACKEND_URL=$(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        FRONTEND_URL=$(gcloud run services describe ${_FRONTEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        echo "Backend API:  $BACKEND_URL"
        echo "Frontend App: $FRONTEND_URL"
        echo "=========================================="
    waitFor: ['deploy-frontend']

images:
  - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${SHORT_SHA}'
  - 'gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest'
  - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${SHORT_SHA}'
  - 'gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
